<script>
  const PF_ITEMS = [
    {file:"../portfolio/assets/graphic/01.jpg", cat:"cat-skincare", brand:"LACO", desc:"Skin Firming Serum – Product Shot"},
    {file:"../portfolio/assets/graphic/02.jpg", cat:"cat-skincare", brand:"LACO", desc:"Coconut Skincare Campaign"},
    {file:"../portfolio/assets/graphic/03.jpg", cat:"cat-fmcg", brand:"BETAGRO", desc:"Facebook Content – Product Comparison"},
    {file:"../portfolio/assets/graphic/04.jpg", cat:"cat-fmcg", brand:"BETAGRO", desc:"Facebook Content – Seasonal Greeting"},
    {file:"../portfolio/assets/graphic/05.jpg", cat:"cat-fmcg", brand:"BETAGRO", desc:"Facebook Content – Menu Promotion"},
    {file:"../portfolio/assets/graphic/06.jpg", cat:"cat-auto", brand:"VK CAR PLAZA / HONGQI", desc:"Facebook Content Grid"},
    {file:"../portfolio/assets/graphic/07.jpg", cat:"cat-auto", brand:"AUTOMOTIVE", desc:"Brand Portrait Campaign"},
    {file:"../portfolio/assets/graphic/08.jpg", cat:"cat-auto", brand:"AUTOMOTIVE", desc:"Print & Signage Mockup"},
    {file:"../portfolio/assets/graphic/09.jpg", cat:"cat-auto", brand:"AUTOMOTIVE", desc:"Vehicle Spec Brochure"},
    {file:"../portfolio/assets/graphic/10.jpg", cat:"cat-auto", brand:"AUTOMOTIVE", desc:"Apparel & Merchandise Mockup"},
    {file:"../portfolio/assets/graphic/11.jpg", cat:"cat-auto", brand:"AUTOMOTIVE", desc:"Large-Format Signboard (11 x 5.5m)"}
  ];

  const grid = document.getElementById('pfGrid');
  PF_ITEMS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'pf-card';
    btn.setAttribute('data-cat', item.cat);
    btn.setAttribute('data-full', item.file);
    btn.setAttribute('data-brand', item.brand);
    btn.setAttribute('data-desc', item.desc);
    btn.innerHTML =
      '<img src="' + item.file + '" alt="' + item.brand + ' - ' + item.desc + '" loading="lazy" />' +
      '<span class="pf-card-info"><strong>' + item.brand + '</strong><span>' + item.desc + '</span></span>';
    grid.appendChild(btn);
  });

  (function(){
    var filters = document.querySelectorAll('.pf-filter');
    var cards = Array.prototype.slice.call(document.querySelectorAll('.pf-card'));
    var lightbox = document.getElementById('pfLightbox');
    var backdrop = document.getElementById('pfBackdrop');
    var lbImg = document.getElementById('pfLbImg');
    var lbCaption = document.getElementById('pfLbCaption');
    var btnClose = document.getElementById('pfClose');
    var btnPrev = document.getElementById('pfPrev');
    var btnNext = document.getElementById('pfNext');
    var currentList = cards;
    var currentIndex = 0;

    filters.forEach(function(btn){
      btn.addEventListener('click', function(){
        filters.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var cat = btn.getAttribute('data-cat');
        cards.forEach(function(card){
          var show = (cat === 'all') || (card.getAttribute('data-cat') === cat);
          card.classList.toggle('pf-hide', !show);
        });
      });
    });

    function visibleCards(){
      return cards.filter(function(c){ return !c.classList.contains('pf-hide'); });
    }

    function openLightbox(card){
      currentList = visibleCards();
      currentIndex = currentList.indexOf(card);
      renderLb();
      backdrop.classList.add('open');
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function renderLb(){
      var card = currentList[currentIndex];
      if (!card) return;
      lbImg.src = card.getAttribute('data-full');
      var brand = card.getAttribute('data-brand');
      var desc = card.getAttribute('data-desc');
      lbCaption.innerHTML = '<strong>' + brand + '</strong>' + desc;
    }

    function closeLightbox(){
      backdrop.classList.remove('open');
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function step(dir){
      if (!currentList.length) return;
      currentIndex = (currentIndex + dir + currentList.length) % currentList.length;
      renderLb();
    }

    cards.forEach(function(card){
      card.addEventListener('click', function(){ openLightbox(card); });
    });

    btnClose.addEventListener('click', closeLightbox);
    backdrop.addEventListener('click', closeLightbox);
    btnPrev.addEventListener('click', function(){ step(-1); });
    btnNext.addEventListener('click', function(){ step(1); });

    document.addEventListener('keydown', function(e){
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });
  })();

  document.getElementById('y').textContent = new Date().getFullYear();
</script>
