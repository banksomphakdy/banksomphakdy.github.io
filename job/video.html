    {file:"../portfolio/assets/video/06.jpg", href:"https://drive.google.com/file/d/1Et9IwBSLcv7BiIP5s6ls7gilwDs_KkYm/view?usp=sharing", title:"HOSPITAL", code:"Campaign 07", cat:"cat-client"},

    {file:"../portfolio/assets/video/08.jpg", href:"https://drive.google.com/file/d/1PV1GgwupnRATJ6h5AZhEV0TPAVg2Ka37/view?usp=sharing", title:"HOSPITAL", code:"Campaign 09", cat:"cat-client"},
    {file:"../portfolio/assets/video/09.jpg", href:"https://drive.google.com/file/d/1oyEfMU_-YbfK2XQe7ZxRa7INeXgpj4Nt/view?usp=sharing", title:"L6-001", code:"Subtitled Edit", cat:"cat-client"},
    {file:"../portfolio/assets/video/10.jpg", href:"https://drive.google.com/drive/folders/1a-PzD2V-qsCtBa6bcVMmZTqqDCbwtc8J?usp=sharing", title:"Phú Quốc", code:"TRAVEL · Day 1", cat:"cat-travel"},
    {file:"../portfolio/assets/video/11.jpg", href:"https://drive.google.com/drive/folders/1a-PzD2V-qsCtBa6bcVMmZTqqDCbwtc8J?usp=sharing", title:"Phú Quốc", code:"TRAVEL · Day 2", cat:"cat-travel"},
    {file:"../portfolio/assets/video/12.jpg", href:"https://drive.google.com/drive/folders/1a-PzD2V-qsCtBa6bcVMmZTqqDCbwtc8J?usp=sharing", title:"Phú Quốc", code:"TRAVEL · Day 3", cat:"cat-travel"},

    {file:"../portfolio/assets/video/16.svg", href:"https://drive.google.com/drive/folders/12lOS1KfwAZG-8HY3jEanS_TmKrjeRHTl?usp=sharing", title:"ອະສັງຫາລິມະຊັບ", code:"Real Estate Reel", cat:"cat-realestate"},
    {file:"../portfolio/assets/video/17.jpg", href:"https://drive.google.com/file/d/1rWnUlKp1mcZTrb1HkYsipgTumhgRieiZ/view?usp=sharing", title:"LaMarket", code:"Toshiba 1.8L Rice Cooker", cat:"cat-client"}
  ];

  const grid = document.getElementById('vfGrid');
  VF_ITEMS.forEach(item => {
    const a = document.createElement('a');
    a.className = 'vf-card';
    a.href = item.href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('data-cat', item.cat);
    a.innerHTML =
      '<img src="' + item.file + '" alt="' + item.title + ' - ' + item.code + '" loading="lazy" />' +
      '<span class="vf-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>' +
      '<span class="vf-card-info"><strong>' + item.title + '</strong><span>' + item.code + '</span></span>';
    grid.appendChild(a);
  });

  (function(){
    var filters = document.querySelectorAll('#vfFilters .pf-filter');
    var cards = Array.prototype.slice.call(document.querySelectorAll('.vf-card'));
    filters.forEach(function(btn){
      btn.addEventListener('click', function(){
        filters.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var cat = btn.getAttribute('data-cat');
        cards.forEach(function(card){
          var show = (cat === 'all') || (card.getAttribute('data-cat') === cat);
          card.classList.toggle('pf-hide', !show);
        });
      });
    });
  })();

  document.getElementById('y').textContent = new Date().getFullYear();
</script>
